name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc-c++ cmake ninja-build extra-cmake-modules
          qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtpdf-devel qt6-qtmultimedia-devel
          kf6-kwindowsystem-devel kf6-kio-devel kf6-syntax-highlighting-devel
          kf6-kcoreaddons-devel kf6-kdbusaddons-devel
          qt6-qtimageformats
          clang-tools-extra dbus-daemon procps-ng diffutils

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: cmake --workflow --preset build

      - name: Run the unit tests
        run: ctest --preset dev -L unit

      - name: Run the controller and command-line tests
        run: ctest --preset dev -R '^(controller|cli)$'

      - name: Lint the QML
        run: cmake --build --preset dev --target all_qmllint

      - name: Check the C++ formatting
        run: |
          cmake --build --preset dev --target clang-format
          git diff --exit-code

      - name: Install fonts, icons, KWin and Dolphin
        run: >
          dnf install -y --setopt=install_weak_deps=False
          google-noto-sans-fonts google-noto-sans-mono-fonts breeze-icon-theme
          /usr/bin/kwin_wayland /usr/bin/dolphin /usr/bin/qdbus-qt6 /usr/sbin/setcap

      - name: Let KWin start without extra privileges
        run: setcap -r /usr/bin/kwin_wayland

      - name: Render the screenshot page
        run: cmake --build --preset dev --target screenshot-page

      - name: Upload the screenshot page
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/

      - name: Run the Dolphin test
        shell: bash
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          runuser -u tester -- ctest --preset dev -R '^dolphin$' | tee dolphin.log
          grep -q 'dolphin .*Passed' dolphin.log
